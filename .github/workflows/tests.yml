name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, openssl, mysqli, pdo_mysql, redis, memcached
          coverage: none
          tools: composer:v2

      - name: Create TypeRocket root install
        run: |
          composer create-project --prefer-dist typerocket/typerocket .
          rm -rf vendor/typerocket/core

      - name: Checkout core package
        uses: actions/checkout@v4
        with:
          path: vendor/typerocket/core

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: vendor/typerocket/core
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('vendor/typerocket/core/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup databases
        run: |
          mysql --host=127.0.0.1 --user=root --execute="SET NAMES utf8; CREATE DATABASE IF NOT EXISTS wordpress;"
          mysql --host=127.0.0.1 --user=root --execute="SET NAMES utf8; CREATE DATABASE IF NOT EXISTS tr_v51_alt;"
          mysql --host=127.0.0.1 --user=root --database=tr_v51_alt --execute="CREATE TABLE IF NOT EXISTS some_table (id INT, text_field VARCHAR(255));"

      - name: Setup TypeRocket test install
        run: vendor/typerocket/core/bin/setup-github-actions.sh
        env:
          DB_NAME: wordpress
          DB_USER: root
          DB_PASSWORD: ''
          DB_HOST: 127.0.0.1
          ALT_DB_NAME: tr_v51_alt

      - name: Verify WordPress database
        run: ./wp-cli.phar db check --allow-root --path=wordpress
        env:
          HTTP_HOST: 127.0.0.1

      - name: Discover tests
        working-directory: vendor/typerocket/core
        run: |
          set -o pipefail
          pwd
          php -v
          test -f phpunit.xml
          test -x vendor/bin/phpunit
          php vendor/bin/phpunit --version 2>&1 | tee phpunit-version.log
          find tests -name '*Test.php' -print | sort

          php vendor/bin/phpunit --configuration phpunit.xml --list-test-files 2>&1 | tee phpunit-list-test-files.log
          test -s phpunit-list-test-files.log

          php vendor/bin/phpunit --configuration phpunit.xml --list-tests 2>&1 | tee phpunit-list-tests.log
          test -s phpunit-list-tests.log
        env:
          HTTP_HOST: 127.0.0.1

      - name: Run tests
        working-directory: vendor/typerocket/core
        run: |
          set -o pipefail
          php vendor/bin/phpunit --configuration phpunit.xml --debug --display-errors --display-warnings --display-deprecations --fail-on-empty-test-suite 2>&1 | tee phpunit-debug.log
        env:
          HTTP_HOST: 127.0.0.1
